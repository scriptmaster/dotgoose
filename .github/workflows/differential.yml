name: Differential tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: C# and Goose parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Fetch the pinned Goose toolchain
        uses: actions/checkout@v6
        with:
          repository: aardappel/goose
          ref: 7b90f91d91845f4ef1712e16ed053f395e4e6e1c
          path: .upstream-goose
          submodules: recursive
          persist-credentials: false

      - name: Build Goose
        run: |
          cmake -S .upstream-goose -B .upstream-goose/build -DCMAKE_BUILD_TYPE=Release
          cmake --build .upstream-goose/build --parallel 2

      - name: Verify the Goose-only parser
        env:
          GOOSE: ${{ github.workspace }}/.upstream-goose/build/goose
        run: bash test/syntax.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile and compare programs
        env:
          GOOSE: ${{ github.workspace }}/.upstream-goose/build/goose
        run: bash test/run.sh

      - name: Verify the web examples over HTTP
        env:
          GOOSE: ${{ github.workspace }}/.upstream-goose/build/goose
        run: |
          python3 test/web.py
